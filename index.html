<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liroc AI</title>

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- AdsGram SDK (обязателен для показа рекламы Rewarded/Interstitial) -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <style>
    :root {
      color-scheme: light dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--tg-theme-bg-color, #0e0e12);
      color: var(--tg-theme-text-color, #f4f4f5);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(127,127,127,0.2);
    }
    header h1 { font-size: 17px; margin: 0; }
    #attempts {
      font-size: 13px;
      opacity: 0.8;
      background: rgba(127,127,127,0.15);
      padding: 4px 10px;
      border-radius: 999px;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 82%;
      padding: 10px 13px;
      border-radius: 14px;
      line-height: 1.4;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--tg-theme-button-color, #3390ec);
      color: var(--tg-theme-button-text-color, #fff);
      border-bottom-right-radius: 4px;
    }
    .msg.bot {
      align-self: flex-start;
      background: rgba(127,127,127,0.15);
      border-bottom-left-radius: 4px;
    }
    .msg.system {
      align-self: center;
      background: transparent;
      opacity: 0.7;
      font-size: 12px;
    }
    footer {
      padding: 10px 12px;
      border-top: 1px solid rgba(127,127,127,0.2);
      display: flex;
      gap: 8px;
    }
    #prompt {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 14px;
      background: rgba(127,127,127,0.15);
      color: inherit;
      outline: none;
    }
    button {
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: var(--tg-theme-button-color, #3390ec);
      color: var(--tg-theme-button-text-color, #fff);
    }
    button:disabled { opacity: 0.5; cursor: default; }
    #adBtn {
      background: #f0a500;
      color: #1a1200;
    }
  </style>
</head>
<body>
  <header>
    <h1>🤖 Liroc AI</h1>
    <span id="attempts">⚡ …</span>
  </header>

  <div id="chat"></div>

  <footer>
    <input id="prompt" type="text" placeholder="Задайте вопрос..." />
    <button id="sendBtn">➤</button>
  </footer>

  <script>
    // ===================== НАСТРОЙКИ =====================
    // Домен вашего Python-бэкенда (тот же сервер, что запускает Liroc_bot.py).
    // Он ДОЛЖЕН быть на HTTPS и с доменом (просто "ip:8080" не подойдёт
    // для Telegram Mini App и для рекламы AdsGram).
    const API_BASE = "https://thee-shrine-skyline.ngrok-free.dev";

    // blockId для формата Rewarded/Interstitial из кабинета AdsGram
    // (https://partner.adsgram.ai) — ЭТО ДРУГОЙ blockId, чем у блока для бота.
    const ADSGRAM_BLOCK_ID = "47497";
    // =======================================================

    const tg = window.Telegram?.WebApp;
    tg?.ready();
    tg?.expand();

    const chatEl = document.getElementById("chat");
    const attemptsEl = document.getElementById("attempts");
    const promptEl = document.getElementById("prompt");
    const sendBtn = document.getElementById("sendBtn");

    function getUserId() {
      return tg?.initDataUnsafe?.user?.id ?? null;
    }

    function addMessage(text, role) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
      return div;
    }

    function setAttempts(n) {
      attemptsEl.textContent = `⚡ ${n}`;
    }

    async function refreshAttempts() {
      const userId = getUserId();
      if (!userId) {
        setAttempts("?");
        return;
      }
      try {
        const res = await fetch(`${API_BASE}/api/attempts?user_id=${userId}`, {
          headers: { "ngrok-skip-browser-warning": "true" },
        });
        const data = await res.json();
        setAttempts(data.attempts);
      } catch (e) {
        console.error("attempts fetch failed", e);
      }
    }

    // --- Инициализация AdsGram SDK (только init, показ — по требованию) ---
    let AdController = null;
    if (window.Adsgram) {
      AdController = window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID });
    }

    async function showAdAndClaimReward() {
      if (!AdController) {
        addMessage("Реклама пока недоступна.", "system");
        return;
      }
      const sysMsg = addMessage("📺 Загружаем рекламу...", "system");
      try {
        await AdController.show();
        // Пользователь досмотрел рекламу до конца (или закрыл интерстишл) —
        // теперь просим бэкенд подтвердить и начислить награду.
        // Бэкенд сам проверяет подпись initData, так что подделать вызов нельзя.
        sysMsg.textContent = "✅ Реклама просмотрена, начисляем награду...";
        const res = await fetch(`${API_BASE}/api/adsgram/webapp-reward`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "ngrok-skip-browser-warning": "true",
          },
          body: JSON.stringify({ initData: tg?.initData || "" }),
        });
        const data = await res.json();
        if (res.ok) {
          sysMsg.textContent = `🎉 Начислено! Всего попыток: ${data.attempts}`;
          setAttempts(data.attempts);
        } else {
          sysMsg.textContent = `⚠️ ${data.error || "Не удалось начислить награду"}`;
        }
      } catch (result) {
        // пользователь закрыл рекламу раньше времени / ошибка показа
        sysMsg.textContent = "❌ Реклама не была досмотрена до конца.";
        console.warn("Ad show error/skip", result);
      }
    }

    function showWatchAdPrompt() {
      const wrap = document.createElement("div");
      wrap.className = "msg system";
      const btn = document.createElement("button");
      btn.id = "adBtn";
      btn.textContent = "🎁 Смотреть рекламу (+ попытки)";
      btn.onclick = () => showAdAndClaimReward();
      wrap.textContent = "Попытки закончились. ";
      wrap.appendChild(btn);
      chatEl.appendChild(wrap);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    async function sendPrompt() {
      const text = promptEl.value.trim();
      const userId = getUserId();
      if (!text || !userId) return;

      addMessage(text, "user");
      promptEl.value = "";
      sendBtn.disabled = true;

      const thinking = addMessage("🧠 Думаю...", "bot");

      try {
        const res = await fetch(`${API_BASE}/api/chat`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "ngrok-skip-browser-warning": "true",
          },
          body: JSON.stringify({ user_id: userId, prompt: text }),
        });
        const data = await res.json();

        if (res.status === 403) {
          thinking.remove();
          showWatchAdPrompt();
        } else {
          thinking.textContent = data.answer;
          setAttempts(data.attempts);
        }
      } catch (e) {
        thinking.textContent = "❌ Ошибка соединения с сервером.";
        console.error(e);
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener("click", sendPrompt);
    promptEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendPrompt();
    });

    refreshAttempts();
  </script>
</body>
</html>
