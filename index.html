<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://adsgram.ai/js/adsgram-ad-sdk.js"></script>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #17212b; color: white; }
    button { padding: 15px 25px; font-size: 16px; border: none; border-radius: 10px; background: #242f3d; color: white; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Получить дополнительные попытки</h2>
  <p>Посмотрите короткое видео, чтобы получить +3 решения задач.</p>
  <button id="adBtn" onclick="showRewardAd()">Посмотреть видео (+3 ⚡)</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    const AdController = window.Adsgram.init({ blockId: "47317" });

    function showRewardAd() {
      AdController.show().then((result) => {
        // Успешный просмотр — отправляем данные в бот
        tg.sendData("reward_given");
      }).catch((result) => {
        alert("Видео не просмотрено до конца. Попробуйте ещё раз.");
      });
    }
  </script>
</body>
</html>
