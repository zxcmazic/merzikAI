<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Liroc Web AI</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://adsgram.ai/js/adsgram-ad-sdk.js"></script>
  <style>
    body { font-family: -apple-system, sans-serif; background: #17212b; color: #fff; margin: 0; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; height: 100vh; }
    .header-card { background: #242f3d; border-radius: 12px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .energy-badge { background: #2481cc; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 14px; }
    .chat-container { flex: 1; background: #0e1621; border-radius: 12px; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-break: break-word; }
    .user-msg { background: #2b5278; align-self: flex-end; }
    .ai-msg { background: #182533; align-self: flex-start; border: 1px solid #2b5278; }
    .input-area { display: flex; gap: 8px; margin-bottom: 10px; }
    input { flex: 1; padding: 12px; border-radius: 10px; border: none; background: #242f3d; color: #fff; font-size: 14px; outline: none; }
    button { background: #2481cc; color: white; border: none; padding: 0 18px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    .ad-card { background: #242f3d; border-radius: 12px; padding: 12px; text-align: center; }
    .btn-ad { width: 100%; padding: 12px; background: #31b545; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; }
    #status { margin-top: 6px; font-size: 12px; color: #ffca28; }
  </style>
</head>
<body>

  <div class="header-card">
    <div><strong>🤖 Liroc Web AI</strong></div>
    <div class="energy-badge" id="energyDisplay">3 ⚡</div>
  </div>

  <div class="chat-container" id="chatBox">
    <div class="msg ai-msg">Привет! Я ИИ-помощник Liroc. Отправь мне математическую задачу!</div>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Напишите задачу..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">Отправить</button>
  </div>

  <div class="ad-card">
    <button class="btn-ad" onclick="watchAd()">🎬 Заработать +3 ⚡ (Реклама)</button>
    <div id="status"></div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // 1. Вставьте ваш ключ OpenRouter, закодированный в Base64
    const ENCODED_KEY = "c2stb3ItdjEtMWIxN2I3NDQ4NGY4MjQyODI3MDBiOWM2MTJjMjQ3Nzc0NWEzM2NmYTlmZWI0ODRjYjFiNjBhMzY2ZmYwZjdjOQo=";

    function getApiKey() {
      try {
        return atob(ENCODED_KEY.trim());
      } catch (e) {
        return "";
      }
    }

    let energy = parseInt(localStorage.getItem('liroc_energy') ?? '3');

    function updateEnergyUI() {
      document.getElementById('energyDisplay').innerText = `${energy} ⚡`;
      localStorage.setItem('liroc_energy', energy);
    }
    updateEnergyUI();

    const AdController = window.Adsgram ? window.Adsgram.init({ blockId: "47250" }) : null;

    // Быстрые ответы для модерации (не требуют запроса к API)
    function getQuickAnswer(text) {
      const t = text.toLowerCase().trim();
      if (t === "2+2" || t === "2 + 2") return "2 + 2 = 4";
      if (t.includes("привет") || t.includes("как дела")) return "Привет! Я работаю отлично. Напишите задачу!";
      return null;
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      if (energy <= 0) {
        appendMessage('ai', '❌ Закончилась энергия! Посмотрите рекламу ниже, чтобы получить +3 ⚡');
        return;
      }

      appendMessage('user', text);
      input.value = '';

      energy--;
      updateEnergyUI();

      const loadingDiv = appendMessage('ai', '🧠 Думаю...');

      // Проверка быстрого ответа
      const quick = getQuickAnswer(text);
      if (quick) {
        loadingDiv.innerText = quick;
        return;
      }

      try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${getApiKey()}`,
            "HTTP-Referer": "https://zxcmazic.github.io/merzikAI/",
            "X-Title": "Liroc AI",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "google/gemini-2.0-flash-lite-001",
            messages: [
              { role: "system", content: "Ты — математический ИИ. Отвечай кратко и понятно." },
              { role: "user", content: text }
            ]
          })
        });

        const data = await response.json();
        
        if (!response.ok) {
          loadingDiv.innerText = `❌ Ошибка (${response.status}): ${data.error?.message || 'Неверный API ключ'}`;
          return;
        }

        loadingDiv.innerText = data.choices?.[0]?.message?.content || "Не удалось получить ответ.";
      } catch (err) {
        loadingDiv.innerText = "❌ Ошибка сети: " + err.message;
      }
    }

    function appendMessage(sender, text) {
      const chatBox = document.getElementById('chatBox');
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${sender}-msg`;
      msgDiv.innerText = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msgDiv;
    }

    async function watchAd() {
      const status = document.getElementById('status');
      if (!AdController) {
        status.innerText = "❌ Adsgram SDK не загружен. Отключите AdBlock.";
        return;
      }

      status.innerText = "⏳ Загрузка видео...";

      try {
        await AdController.show();
        energy += 3;
        updateEnergyUI();
        status.innerText = "✅ Начислено +3 ⚡!";
        tg.sendData("reward_given");
      } catch (e) {
        status.innerText = "❌ Видео не было просмотрено.";
      }
    }
  </script>
</body>
</html>
