<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр рекламы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
</head>
<body style="background: #111; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif;">

    <h2 id="status">Загрузка рекламы...</h2>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Ваш новый ID рекламного блока
        const AdController = window.Adsgram.init({ blockId: "47250" });

        AdController.show().then((result) => {
            document.getElementById('status').innerText = "✅ Готово! Вернитесь в бота за решением.";
            setTimeout(() => {
                tg.close();
            }, 1500);
        }).catch((result) => {
            document.getElementById('status').innerText = "❌ Реклама не просмотрена! Попробуйте снова.";
        });
    </script>
</body>
</html>
