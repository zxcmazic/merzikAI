<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://adsgram.ai/js/adsgram-ad-sdk.js"></script>
  <style>
    body { font-family: -apple-system, sans-serif; background: #17212b; color: #fff; margin: 0; padding: 15px; box-sizing: border-box; }
    .card { background: #242f3d; border-radius: 14px; padding: 15px; margin-bottom: 12px; }
    .energy-header { display: flex; justify-content: space-between; align-items: center; }
    .energy-badge { background: #2481cc; padding: 6px 12px; border-radius: 20px; font-weight: bold; }
    .chat-box { height: 200px; overflow-y: auto; background: #0e1621; border-radius: 10px; padding: 10px; font-size: 14px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
    .msg { padding: 8px 12px; border-radius: 8px; max-width: 85%; }
    .user-msg { background: #2b5278; align-self: flex-end; }
    .ai-msg { background: #182533; border: 1px solid #2b5278; align-self: flex-start; }
    .input-row { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px; border-radius: 8px; border: none; background: #182533; color: white; outline: none; }
    button { background: #2481cc; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-ad { width: 100%; padding: 12px; background: #31b545; font-size: 15px; }
    #status { margin-top: 8px; font-size: 13px; color: #ffca28; text-align: center; }
  </style>
</head>
<body>

  <!-- Баланс энергии -->
  <div class="card energy-header">
    <span>⚡ Баланс энергии:</span>
    <span class="energy-badge" id="energyCount">3 ⚡</span>
  </div>

  <!-- Чат ИИ №2 внутри Mini App -->
  <div class="card">
    <h3>🤖 Liroc Web AI</h3>
    <div class="chat-box" id="chatBox">
      <div class="msg ai-msg">Привет! Я веб-версия ИИ. Задавай вопрос прямо здесь!</div>
    </div>
    <div class="input-row">
      <input type="text" id="userInput" placeholder="Напишите задачу...">
      <button onclick="sendWebMessage()">Отправить</button>
    </div>
  </div>

  <!-- Рекламный блок -->
  <div class="card" style="text-align: center;">
    <h3>🎁 Закончилась энергия?</h3>
    <p style="font-size: 13px; color: #7f91a4;">Посмотрите видео, чтобы получить +3 решения.</p>
    <button class="btn-ad" onclick="showRewardAd()">🎬 Посмотреть видео (+3 ⚡)</button>
    <div id="status"></div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Ключ OpenRouter напрямую в клиенте (для тестов и работы в Mini App)
    const OPENROUTER_KEY = "c2stb3ItdjEtMWIxN2I3NDQ4NGY4MjQyODI3MDBiOWM2MTJjMjQ3Nzc0NWEzM2NmYTlmZWI0ODRjYjFiNjBhMzY2ZmYwZjdjOQo="; 

    // Локальное хранилище энергии
    let attempts = parseInt(localStorage.getItem('user_attempts') ?? '3');
    
    function updateUI() {
      document.getElementById('energyCount').innerText = `${attempts} ⚡`;
      localStorage.setItem('user_attempts', attempts);
    }
    updateUI();

    // Инициализация Adsgram
    const AdController = window.Adsgram ? window.Adsgram.init({ blockId: "47250" }) : null;

    // Запрос к ИИ прямо из браузера
    async function sendWebMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chatBox');

      if (attempts <= 0) {
        chatBox.innerHTML += `<div class="msg ai-msg" style="color: #ff5252;">❌ Закончились решения! Посмотрите рекламу ниже.</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
        return;
      }

      chatBox.innerHTML += `<div class="msg user-msg">${text}</div>`;
      input.value = '';
      
      attempts--;
      updateUI();

      const loadingMsg = document.createElement('div');
      loadingMsg.className = 'msg ai-msg';
      loadingMsg.innerText = '🧠 Думаю...';
      chatBox.appendChild(loadingMsg);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${OPENROUTER_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "openrouter/auto",
            messages: [
              { role: "system", content: "Ты ИИ-помощник. Отвечай коротко и понятно." },
              { role: "user", content: text }
            ]
          })
        });

        const data = await response.json();
        const reply = data.choices?.[0]?.message?.content || "Не удалось получить ответ.";
        loadingMsg.innerText = reply;
      } catch (e) {
        loadingMsg.innerText = "❌ Ошибка соединения с ИИ.";
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Просмотр рекламы
    async function showRewardAd() {
      const statusDiv = document.getElementById('status');
      if (!AdController) {
        statusDiv.innerText = "❌ Adsgram SDK не загружен";
        return;
      }

      statusDiv.innerText = "⏳ Загрузка видео...";

      try {
        await AdController.show();
        attempts += 3;
        updateUI();
        statusDiv.innerText = "✅ Начислено +3 ⚡!";
        tg.sendData("reward_given"); // Сигнал для синхронизации с Telegram-ботом
      } catch (error) {
        statusDiv.innerText = "❌ Просмотр не завершен";
      }
    }
  </script>
</body>
</html>
